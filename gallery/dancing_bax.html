<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dancing_bax</title>
    <link rel="stylesheet" type="text/css" href="../css_styles/style.css">

    <style>
        body {
            margin: 0;
            overflow-y: scroll;
        }

        /* 固定宽度居中容器（不响应） */
        .page-container {
            width: 1660px;
            margin: 0 auto;
            padding-top: 20px;
            padding-bottom: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            /* 模块之间的纵向间距 */
        }

        .full-page-container {
            width: 1580px;
            margin: 0 auto;
            padding-top: 20px;
            padding-bottom: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* 每个模块都限制在你原本图片的“内容宽” */
        .content-block {
            width: 1080px;
        }

        /* 视频块 */
        .video-wrapper {
            width: 1080px;
        }

        video {
            display: block;
            width: 1080px;
            height: auto;
            margin: 0 auto;
        }

        /* 文本块 */
        .intro {
            width: 1080px;
            text-align: center;
            padding-top: 10px;
            padding-bottom: 60px;
        }

        .banner {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Gallery */
        .gallery {
            width: 1080px;
            column-count: 2;
            column-gap: 20px;
            margin: 0 auto;
        }

        .gallery-item {
            width: 100%;
            margin-bottom: 20px;
            break-inside: avoid;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
        }

        .cinema-section {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            padding: 80px 0 40px;
        }

        .cinema-section video::-webkit-media-controls-fullscreen-button {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                overflow-x: hidden;
            }

            .page-container,
            .full-page-container {
                width: 100%;
                padding-left: 16px;
                padding-right: 16px;
                box-sizing: border-box;
            }

            .content-block,
            .video-wrapper,
            .intro,
            .gallery {
                width: 100%;
            }

            video {
                width: auto;
                height: auto;
                max-width: 100%;
                max-height: 100%;
            }

            .gallery {
                column-count: 1;
            }

            .cinema-section {
                height: 40vh;
                padding: 0;
                align-items: center;
                background: transparent;
            }
        }
    </style>
</head>

<body>
    <div class="cinema-section">
        <video controls controlsList="nofullscreen" disablePictureInPicture preload="metadata" playsinline
            poster="../images_videos/multimedia_storytelling/dancing_bax/video cover.png">

        </video>
    </div>

    <div class="page-container">

                                target="_blank" rel="noopener noreferrer">Process Link</a></quote>
                    </bold>
                </p>
                <p>
                    <bold>

                </p>
                <p>

                </p>
                <p>
                    <bold>

                    </bold>
                </p>
                <p>
                    <bold>
                        <quote><a href="https://brianjbishop.com" target="_blank"
                                rel="noopener noreferrer">Brian Bishop</a></quote>
                    </bold>
                </p>

                <p>

        <section class="content-block">

            <div class="gallery">

                <div class="gallery-item">

                </div>

                <div class="gallery-item">

            </div>

            <div class="banner">

</body>
