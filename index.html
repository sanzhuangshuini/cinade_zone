<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>home</title>

  <link rel="stylesheet" type="text/css" href="css_styles/style.css">

  <style>
    body {
      margin: 0;
      background: #fff;
      display: flex;
      height: 100vh;
    }

    .home-logo-hover {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      mix-blend-mode: overlay;
    }

    #side-logo {
      display: block;
      width: 500px;
      height: auto;
      transition: filter 0.3s ease;
    }

    @media (min-width: 769px) {
      .home-logo-hover:hover #side-logo {
        filter: blur(10px) sepia(0.3);
      }
    }

    .home-logo-hover-text {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      transform: translateY(-50%);
      margin: 0;
      padding: 0 20px;
      box-sizing: border-box;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    @media (min-width: 769px) {
      .home-logo-hover:hover .home-logo-hover-text {
        opacity: 1;
      }
    }

    #main-area {
      flex: 1;
      padding: 0;
      margin: 0;
      overflow: hidden;
      position: relative;
      background: #fff;
    }

    .plant-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 768px) {
      html, body {
        overflow-x: hidden;
      }

      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      .home-logo-hover {
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
      }

      #side-logo {
        width: 230px;
      }

      #main-area {
        position: relative;
        flex: none;
        width: 100%;
        height: 1000px;
      }

      .plant-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 35% center;
      }
    }
  </style>

</head>

<body class="home">

  <div class="home-logo-hover">
    <a href="index.html">
      <img id="side-logo" src="images_videos/logo/original - Copy.png">
    </a>
    <p class="home-logo-hover-text"><bold>CinadeZone Studio<br>Game<br>Multimedia<br>Concept Art</bold></p>
  </div>

  <nav id="navbar">
    <a href="./index.html">HOME</a>
    <a href="./gallery/index.html">GALLERY</a>
    <a href="./about_contact/index.html">ABOUT&nbsp;& CONTACT</a>
  </nav>

  <div id="main-area">
    <div>
      <img class="plant-img" src="./images_videos/homepage/home.gif" alt="plant">
    </div>
  </div>

  <script>
    document.addEventListener("touchstart", function () {}, { passive: true });
  </script>

  <script>
    (function () {
      const links = document.querySelectorAll("#navbar a");
      const currentPath = location.pathname;

      const knownSections = ["gallery", "about_contact"];

      function getDir(path) {
        const parts = path.split("/").filter(Boolean);
        if (parts.length && parts[parts.length - 1].includes(".")) parts.pop();
        for (let i = parts.length - 1; i >= 0; i--) {
          if (knownSections.includes(parts[i])) return parts[i];
        }
        return "";
      }

      const currentDir = getDir(currentPath);

      links.forEach(a => {
        const url = new URL(a.href, location.origin);
        const linkDir = getDir(url.pathname);

        if (linkDir === currentDir) {
          a.classList.add("active");
        }
      });

    })();
  </script>

</body>

</html>
