<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>contact</title>

  <link rel="stylesheet" type="text/css" href="../css_styles/style.css">

  <script src="libraries/p5.min.js"></script>
  <script src="libraries/p5.sound.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.164/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.164/examples/js/controls/OrbitControls.js"></script>

  <style>
    body {
      margin: 0;
      background: #fff;
      display: flex;
      /* 让左栏 + 右侧内容并排 */
      height: 100vh;
    }

    /* 右侧主内容区 */
    #main-area {
      flex: 1;
      margin-left: 100px;
      /* 让内容不被 navbar 覆盖 */
      background: #fff;
      display: flex;
      justify-content: center;
      /* 水平居中 */
      align-items: center;
      /* 垂直居中 */
      overflow: hidden;
      /* 不出现滚动条 */
    }

    /* 居中的 contact 容器 */
    .contact-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 40px;
    }

    /* 左侧竖图 + 悬浮文字 的层叠容器 */
    .logo-hover {
      position: relative;
      display: inline-block;
    }

    /* 左侧竖图 */
    .business-card {
      width: 320px;
      height: auto;
      object-fit: cover;
      display: block;
      transition: filter 0.3s ease;
    }

    .logo-hover:hover .business-card {
      filter: blur(10px) sepia(0.3);
    }

    /* 悬浮在 logo 上的文字，居中层叠、左对齐 */
    .logo-hover-text {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      transform: translateY(-50%);
      margin: 0;
      padding: 0 20px;
      box-sizing: border-box;
      text-align: left;
      color: #1f1f1f;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .logo-hover:hover .logo-hover-text {
      opacity: 1;
    }

    /* 右侧文字 */
    .contact-text p {
      margin: 25px 0;
      /* 控制段落之间的距离 */
      text-align: left;
    }

    @media (max-width: 768px) {
      html, body {
        overflow-x: hidden;
      }

      #main-area {
        margin-left: 0;
        overflow-y: auto;
        padding: 20px;
        padding-bottom: 150px;
        box-sizing: border-box;
      }

      .contact-container {
        flex-direction: column;
        gap: 28px;
      }

      .business-card {
        width: 200px;
      }

      /* 手机端：点击 logo 切换模糊+文字效果，不依赖鼠标悬浮 */
      .logo-hover.active .business-card {
        filter: blur(10px) sepia(0.3);
      }

      .logo-hover.active .logo-hover-text {
        opacity: 1;
      }

      /* logo 下方联系信息的行距，改小到跟上面 description 文字一致 */
      .contact-text p {
        margin: 6px 0;
        line-height: 1.6;
      }
    }
  </style>

</head>

<body class="subpage">

  <!-- 左侧 Sidebar -->
  <nav id="navbar">
    <a href="../index.html">HOME</a>
    <a href="../gallery/index.html">GALLERY</a>
    <a href="../about_contact/index.html">ABOUT & CONTACT</a>
  </nav>

  <!-- 右侧内容 -->
  <div id="main-area">
    <div class="contact-container">

      <!-- 左侧竖图 + 悬浮显示的文字 -->
      <div class="logo-hover">
        <img class="business-card" src="../images_videos/logo.png" alt="business card">
        <p class="logo-hover-text"><bold>Studio Description. Currently based in Brooklyn, NY. The rest hasn't been decided yet.</bold></p>
      </div>

      <!-- 右侧文字 -->
      <div class="contact-text">
        <p>Email: <a href="mailto:cinadezone@gmail.com">cinadezone@gmail.com</a></p>
        <p>Instagram: <a href="https://www.instagram.com/dogzone6_/" target="_blank"
            rel="noopener noreferrer">@dogzone6_</a></p>
        <p>Xiaohongshu: <a href="https://www.xiaohongshu.com/user/profile/60e15395000000002002c945" target="_blank"
            rel="noopener noreferrer">@散装水泥</a></p>
        <p>Vimeo: <a href="https://vimeo.com/user226251634" target="_blank"
            rel="noopener noreferrer">@Max Liu</a></p>
        <p>Languages: Chinese and English</p>
      </div>

    </div>
  </div>


  <script>
    (function () {
      const links = document.querySelectorAll("#navbar a");
      const currentPath = location.pathname;

      const knownSections = ["gallery", "about_contact"];

      function getDir(path) {
        const parts = path.split("/").filter(Boolean);
        if (parts.length && parts[parts.length - 1].includes(".")) parts.pop();
        for (let i = parts.length - 1; i >= 0; i--) {
          if (knownSections.includes(parts[i])) return parts[i];
        }
        return "";
      }

      const currentDir = getDir(currentPath);

      links.forEach(a => {
        const url = new URL(a.href, location.origin);
        const linkDir = getDir(url.pathname);

        if (linkDir === currentDir) {
          a.classList.add("active");
        }
      });

    })();
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const logoHover = document.querySelector(".logo-hover");
      if (!logoHover) return;

      logoHover.addEventListener("click", (e) => {
        e.stopPropagation();
        logoHover.classList.toggle("active");
      });

      document.addEventListener("click", () => {
        logoHover.classList.remove("active");
      });
    });
  </script>

</body>

</html>
